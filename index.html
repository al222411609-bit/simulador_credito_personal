<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Banco YMMH - Simulador de Crédito</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="container">

    <div class="logo">
      <span class="logo-siglas">YMMH</span>
      <span class="logo-texto">Banco YMMH</span>
    </div>

    <h1>Simulador de Crédito Personal</h1>
    <p class="descripcion">Calcula cuánto pagarías cada mes según el monto, la tasa y el plazo.</p>

    <form id="credit-form">
      <label for="nombre">Nombre completo</label>
      <input type="text" id="nombre" placeholder="Escribe tu nombre" required>

      <label for="monto">Monto del crédito ($)</label>
      <input type="number" id="monto" value="150000" required>

      <label for="tasa">Tasa de interés anual (%)</label>
      <input type="number" id="tasa" value="34" step="0.1" required>

      <label for="plazo">Plazo (meses)</label>
      <select id="plazo">
        <option value="12">12 meses</option>
        <option value="24">24 meses</option>
        <option value="36">36 meses</option>
        <option value="48" selected>48 meses</option>
        <option value="60">60 meses</option>
      </select>

      <button type="submit" id="btn-calcular">Calcular pagos</button>
    </form>

    <div id="resultado" class="resultado" hidden>
      <h2 id="saludo"></h2>

      <table id="tabla-amortizacion">
        <thead>
          <tr>
            <th>Mes</th>
            <th>Capital</th>
            <th>Interés</th>
            <th>IVA</th>
            <th>Pago mensual</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
